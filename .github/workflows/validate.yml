name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository contract
        run: python tools/validate_repository.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile maintained Python
        run: python -m compileall -q src tools
